# Dead-battery MacBook fix (omarchy-omar): refuse ALL sleep at the logind level.
#
# WHY suspend is disabled entirely on this machine — not just hibernation:
#
#   * The battery is DEAD (0% capacity, pack health ~93% but cannot hold a
#     charge). The machine runs on the AC adapter alone, permanently.
#   * Suspending uses RAM for state but the battery is what holds the machine
#     up during sleep. With no usable battery, ANY power blip during suspend
#     (charger bumped, AC flicker, power strip flipped) = hard power loss =
#     crash on wake, possibly filesystem damage.
#   * The machine is a SERVER (agent gateway, SSH, web). A sleeping server is
#     a down server. It should be on 24/7 — that's the whole point.
#   * s2idle is the only reliable suspend mode on this hardware anyway
#     (no ACPI S3), and even that is pointless on a battery-less box.
#
# AllowSuspend=no makes logind reject EVERY suspend request from any client:
# sleep menu, `systemctl suspend`, lid close, power button, UPower — all
# no-ops. This is the final layer; it complements:
#   - UPower CriticalPowerAction=Ignore  (configs/UPower/20-dead-battery.conf)
#   - masked hibernate targets            (see docs/02-power-fixes.md)
#   - HandleLidSwitch=ignore             (logind.conf.d drop-in)
#
# Trade-off accepted: this machine can never sleep by any path. On a dead
# battery that is a feature, not a bug.
#
# Install:  sudo cp this file to /etc/systemd/sleep.conf.d/30-no-suspend.conf
#           sudo systemctl daemon-reload
# Verify:   busctl call org.freedesktop.login1 /org/freedesktop/login1 \
#             org.freedesktop.login1.Manager CanSuspend   # → s "no"
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
