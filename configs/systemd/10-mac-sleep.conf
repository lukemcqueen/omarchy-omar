# MacBook (2015-era) suspend recipe — s2idle is the only reliable suspend
# mode on this hardware (ACPI S3 is not supported on many MacBook models).
#
# Install:  sudo cp this file to /etc/systemd/sleep.conf.d/10-mac-sleep.conf
#           sudo systemctl daemon-reload
[Sleep]
MemorySleepMode=s2idle
SuspendState=freeze
