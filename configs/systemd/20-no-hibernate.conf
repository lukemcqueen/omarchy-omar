# Dead-battery fix (omarchy-omar): never hibernate on a battery that can't
# hold charge. Masked targets are the first layer; this refuses at the config
# layer too, so an update that unmasks a target can't re-enable hibernation.
# Suspend stays allowed (manual sleep / sleep menu still work).
#
# Install:  sudo cp this file to /etc/systemd/sleep.conf.d/20-no-hibernate.conf
#           sudo systemctl daemon-reload
[Sleep]
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
