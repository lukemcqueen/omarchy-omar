# fail2ban defaults — nftables ban backend, systemd backend (omarchy-omar).
#
# nftables banaction composes with ufw/nftables firewalls; bans appear as
# nft sets (inspect:  nft list set inet f2b-table addr-set f2b-sshd).
# backend = systemd reads the journal directly (no log-polling races).
#
# Install:  sudo cp this file to /etc/fail2ban/jail.d/defaults-local.conf
#           sudo systemctl restart fail2ban
[DEFAULT]
banaction = nftables
banaction_allports = nftables[type=allports]
backend = systemd

[sshd]
enabled = true
