# Dead-battery MacBook fix (omarchy-omar).
#
# Root cause: UPower's default CriticalPowerAction=Auto maps to "Sleep" in
# up-backend.c. On a MacBook with a dead battery (reads 0% at boot, before AC
# is detected as online), the "discharging ≤2%" critical level fires and the
# machine suspends ~30s after every boot — killing SSH and agents until login.
# Ubuntu/Mint default to HybridSleep, which falls through to Ignore on boxes
# without swap-based hibernation (hence "it worked on Mint").
#
# Install:  sudo cp this file to /etc/UPower/UPower.conf.d/20-dead-battery.conf
#           sudo systemctl restart upower
# Verify:   busctl call org.freedesktop.UPower /org/freedesktop/UPower \
#             org.freedesktop.UPower GetCriticalAction   # → s "Ignore"
[UPower]
CriticalPowerAction=Ignore
AllowRiskyCriticalPowerAction=true
